services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threadmark
      POSTGRES_USER: threadmark
      POSTGRES_PASSWORD: threadmark
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadmark"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - threadmark-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: threadmark
      MINIO_ROOT_PASSWORD: threadmark-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - threadmark-minio:/data

  bucket-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 threadmark threadmark-secret
      && mc mb --ignore-existing local/threadmark"

  threadmark:
    build:
      context: .
      args:
        CARGO_FEATURES: --features trusted-headers
    environment:
      DATABASE_URL: postgres://threadmark:threadmark@postgres:5432/threadmark
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_URL: http://localhost:8090
      THREADMARK_SECRET: local-development-secret-change-me
      AUTH_MODE: trusted_headers
      FILE_MAX_MB: 32
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9010
      S3_REGION: us-east-1
      S3_BUCKET: threadmark
      S3_ACCESS_KEY_ID: threadmark
      S3_SECRET_ACCESS_KEY: threadmark-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully

volumes:
  threadmark-postgres:
  threadmark-minio:
